name: Full Test (self-hosted)

on:
  workflow_dispatch:

  # Disabled for now: the organization self-hosted runner this workflow's
  # `test` job depends on was removed, and MIKE+ CI/CD is being reworked.
  # Re-enable these triggers once a runner is available again.
  # push:
  #   branches: [ "main" ]
  # pull_request:
  #   branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
      - name: Set up just
        uses: extractions/setup-just@v2
      - name: Install
        run: just setup
      - name: Lint
        run: just lint

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
      - name: Set up just
        uses: extractions/setup-just@v2
      - name: Install
        run: just setup
      - name: Type check
        run: just typecheck

  test:
    runs-on: self-hosted
    needs: [lint, types]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up UV and Python ${{ matrix.python-version }}
        id: setup-uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            **/requirements*.txt
            **/setup.py
            **/pyproject.toml

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Install project dependencies and test requirements
        run: just setup test

      - name: Test with pytest
        run: just test-ci -v
