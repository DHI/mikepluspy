name: PR Checks

# Lightweight checks that run on every PR (and pushes to main) without needing
# the MIKE+ self-hosted runner: linting and type checking only, no tests. These
# mirror the lint/typecheck jobs in python_publish.yml so PRs get the same
# baseline coverage while MIKE+ CI/CD is being reworked.

on:
  workflow_dispatch:

  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up uv and Python
      uses: astral-sh/setup-uv@v5
      with:
        python-version: '3.12'
    - name: Set up just
      uses: extractions/setup-just@v2
    - name: Install
      run: just setup
    - name: Lint
      run: just lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Set up just
        uses: extractions/setup-just@v2
      - name: Install
        run: just setup
      - name: Type check
        run: just typecheck
