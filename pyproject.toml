[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["notebooks", "tests"]

[project]
name = "mikeplus"
version = "2026.1.0"
dependencies = [
    "numpy>=2.3",
    "pythonnet>=3.0.5",
    "pandas>=2.3",
]
authors = [
  { name="Ryan Walter Murray", email="rywm@dhigroup.com" },
  { name="Wen Wu", email="WUW@dhigroup.com" },
]
description = "A python script package to manipulate MIKE+ database, run simulation by using MIKE+ data, run tools based on MIKE+ data"
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff>=0.16,<0.17",  # minor releases change the default rule set
    "shapely",
    "geopandas",
    "jinja2>=3.0.0",
    "pyrefly==1.3.2",
    "ast-grep-cli==0.45.3",  # scripts/lint_docs_examples.py
    "pandas-stubs>=2.2.2.240807",
    "ipykernel>=6.29.5",
    "griffe~=2.1.0",  # scripts/lint_docs_examples.py; the pin great-docs 0.17 needs
]
test = [
    "pytest",
    "pytest-timeout",
    "shapely",
    "geopandas",
    "jinja2>=3.0.0",
    "pyrefly==1.3.2",
    "ast-grep-cli==0.45.3",
    "pandas-stubs>=2.2.2.240807",
    "griffe~=2.1.0",  # imported by the tests of scripts/lint_docs_examples.py
]

[dependency-groups]
# Installed without the package itself: great-docs reads the source statically,
# and importing mikeplus needs a MIKE+ install. Quarto is installed separately.
docs = [
    # Pre-1.0; minor releases change the config format.
    "great-docs~=0.17.0",
]

[project.urls]
"Homepage" = "https://github.com/DHI/mikepluspy"
"Bug Tracker" = "https://github.com/DHI/mikepluspy/issues"

[tool.pyrefly]
project-includes = ["mikeplus"]
project-excludes = ["mikeplus/tables/auto_generated/**"]
preset = "default"
python-version = "3.13"
ignore-missing-imports = ["DHI.*", "ThinkGeo.*", "System", "System.*"]
replace-imports-with-any = ["clr"]  # pythonnet adds AddReference at runtime

[tool.ruff]
include = ["pyproject.toml", "mikeplus/**/*.py"]
extend-exclude = [".claude"]  # agent worktrees carry their own pyproject.toml
lint.exclude = ["notebooks/**/*.ipynb", "mikeplus/tables/auto_generated/*.py"]
format.exclude = ["notebooks/**/*.ipynb", "mikeplus/tables/auto_generated/*.py"]
lint.extend-select = ["D", "PD", "NPY", "FA", "DOC102"]
lint.preview = true
lint.explicit-preview-rules = true  # preview rules only when selected by code, e.g. DOC102
lint.pydocstyle.convention = "numpy"
lint.ignore = [
    "E501",
    "BLE001",  # wrapping arbitrary .NET exceptions from pythonnet is intentional
    "RUF100",  # preview turns it on; noqa codes for lint-changed's stricter rules look unused here
]

[tool.pytest.ini_options]
addopts = [
    "--strict-markers",
    "--durations=50",
    "--durations-min=0.5",
    "--disable-warnings",
    "-s",
    "-m not slow",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "license_required: marks tests that require a license (deselect with '-m \"not license_required\"')",
    "timeout: marks a test with a timeout value in seconds",
    "skip_ci: marks a test to be skipped on CI",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = ["always"]
